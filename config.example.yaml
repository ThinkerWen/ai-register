# 并发
concurrency: 1
# 一批注册账号数
total_accounts: 1
# 代理（国外)
proxy: "http://127.0.0.1:7890"
# 注册成功账号保存路径
token_dir: "~/.ai-register/token_dir"

model_provider: "openai"  # 可选，与 model_providers 一致
model_providers:
  grok:
    browser_proxy: "http://127.0.0.1:7890"
  openai:
    # 一般不修改
    enable_oauth: true
    oauth_required: true
    oauth_issuer: "https://auth.openai.com"
    oauth_client_id: "app_EMoamEEZ73f0CkXaXp7hrann"
    oauth_redirect_uri: "http://localhost:1455/auth/callback"

mail_provider: "tempmail"  # 可选，与 mail_providers 一致
mail_providers:
  duckmail:
    # 见：https://www.duckmail.sbs/cn/api-docs
    api_base: "https://api.duckmail.sbs"
    bearer: "<YOUR_DUCKMAIL_BEARER>"
  tempmail:
    # 见：https://tempmail.lol/cn/api
    proxy: "http://127.0.0.1:7890"
    api_key: "<YOUR_TEMPMAIL_API_KEY>"
    domain: ""
    prefix: ""
  tempmail_hub:
    # 自部署 Temp Mail 聚合服务，api_base 填服务根地址（不含 /v1）
    api_base: "http://127.0.0.1:8000"
    api_token: "<YOUR_TEMP_MAIL_APP_API_TOKEN>"  # 对应服务端 app.api_token
    provider: "auto"  # 上游：auto / xxxx
    ttl_seconds: 3600  # 需在所选上游支持的有效期内
    create_timeout: 120  # 等待异步创建完成的秒数
    poll_interval: 1  # 创建状态查询间隔（秒）
    proxy: ""  # 默认直连，不继承全局或环境代理；需要时单独配置

cpa:
  # 是否上传到 CPA 见：https://github.com/router-for-me/CLIProxyAPI
  enable: false
  api_url: "http://localhost:8317/v0/management/auth-files"
  token: "<YOUR_CPA_TOKEN>"
  use_proxy: false  # 是否在上传时强制使用全局 `proxy` 配置

g2a:
  # 是否上传到 grok2api（新版 3.0 go 版），见：https://github.com/chenyme/grok2api
  enable: false
  # 远端 grok2api 基础地址，例如 https://your-grok2api.com
  api_url: "https://your-grok2api.com"
  # 管理员账号密码
  admin_username: "admin"
  admin_password: "your-password"
  use_proxy: false  # 是否在上传时强制使用全局 `proxy` 配置
