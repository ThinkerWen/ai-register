[project]
name = "ai-register"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.9"
dependencies = [
    "DrissionPage>=4.1.0.9",
    "curl-cffi>=0.13.0",
    "loguru>=0.7.3",
    "pyvirtualdisplay>=3.0",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "tempmail-lol>=3.0.0",
]

[tool.ruff]
line-length = 140

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# 注入的 JS 脚本字符串较长，拆分反而降低可读性
"register/grok/grok.py" = ["E501"]
